{% load humanize %}
{% load l10n %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:Cuenta:.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body class="container mt-5">
    <div class="d-flex flex-column align-items-center">
        <h2 class="text-center mb-5">(Cambio desde rama)Actualizar cuenta #{{ cuenta.tipo_cuenta }}</h2>
        <!-- El formulario envía los datos mediante POST a la misma URL -->
        <form method="POST" action="{% url 'actualizar_cuenta' cuenta.id %}" class="card p-10 shadow-sm mb-4" style="width: 100%; max-width: 500px;">
            {% csrf_token %}
            
            <label class="form-label">Tipo Cuenta (Número):</label>
            <input type="number" name="txtTipoCuenta" value="{{ cuenta.tipo_cuenta }}" class="form-control mb-1" required>
            <div class="form-text mb-5">Actualiza el número de cuenta</div>

            <label class="form-label">Descripción:</label>
            <input type="text" name="txtDescripcion" value="{{ cuenta.descripcion }}" class="form-control mb-1" required>
            <div class="form-text mb-5">Actualiza la descripción de la cuenta</div>

            <label class="form-label">Saldo Inicial:</label>
            <input type="number" step="0.01" name="txtSaldo" value="{{ cuenta.saldo|unlocalize }}" class="form-control mb-1" required>
            <div class="form-text mb-6">Actualiza el saldo inicial de la cuenta</div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn-solid btn-styled theme-primary btn-lg px-4">Guardar Cuenta</button><button type="button" class="btn-solid btn-styled theme-danger btn-lg px-4" onclick="window.location.href='{% url 'listar_cuentas' %}'">Cancelar</button>
            </div>
        </form>
    </div>
</body>
</html>
